<meta charset="utf-8">
<title>Private PythonScript raw text parsing</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<!-- Hold the main parser so speculative scanning sees the following source. -->
<script src="resources/pause.py"></script>
<pyscript id="raw">
if 1 < 2:
    print('世界 &amp; <img src="must-not-request-pyscript.png">')
    print('<script src="must-not-request-pyscript.js"></script>')
    print('<link rel="stylesheet" href="must-not-request-pyscript.css">')
</PyScRiPt>
<pyscript id="external" src="must-not-request-pyscript.py">print(42)</pyscript>
<pyscript id="selfclosing"/>literal &amp; <b>text</b></pyscript>
<p id="after">after</p>
<script>
test(() => {
  const raw = document.querySelector('#raw');
  assert_equals(raw.constructor.name, 'HTMLElement');
  assert_equals(raw.children.length, 0);
  assert_true(raw.textContent.startsWith('\nif 1 < 2:\n    print('));
  assert_true(raw.textContent.includes('世界 &amp; <img'));
  assert_equals(getComputedStyle(raw).display, 'none');
  assert_equals(raw.innerHTML, raw.textContent);
}, 'Enabled native element preserves raw source and is hidden');

test(() => {
  assert_equals(document.querySelector('#selfclosing').textContent,
                'literal &amp; <b>text</b>');
  assert_equals(document.querySelector('#after').textContent, 'after');
}, 'A self-closing flag does not end a raw text block');

test(() => {
  const source = 'if x < 2:\n    print("&amp; <img src=x>")';
  const container = document.createElement('div');
  container.innerHTML = '<pyscript>' + source + '</pyscript>';
  const python = container.firstChild;
  assert_equals(python.textContent, source);
  assert_equals(python.children.length, 0);
  python.innerHTML = source;
  assert_equals(python.textContent, source);
  assert_equals(python.innerHTML, source);
  const range = document.createRange();
  range.selectNodeContents(python);
  assert_equals(range.createContextualFragment(source).textContent, source);
}, 'Nested, context and range fragments use raw text through the generic fallback');

test(() => {
  const source = 'print("<img src=x> &amp;")';
  const parsed = new DOMParser().parseFromString(
      '<pyscript>' + source + '</pyscript>', 'text/html');
  assert_equals(parsed.querySelector('pyscript').textContent, source);
  assert_equals(parsed.querySelector('img'), null);
  const template = document.createElement('template');
  template.innerHTML = '<pyscript>' + source + '</pyscript>';
  assert_equals(template.content.firstChild.textContent, source);
  assert_equals(template.content.querySelector('img'), null);
}, 'DOMParser and template contents preserve source without creating fake elements');

async_test(t => addEventListener('load', t.step_func_done(() => {
  assert_equals(document.querySelector('img'), null);
  assert_equals(document.querySelector('link'), null);
  assert_false(performance.getEntriesByType('resource').some(
      entry => entry.name.includes('must-not-request-pyscript')));
})), 'Neither the parser nor preload scanner requests Python literals or src');
</script>
